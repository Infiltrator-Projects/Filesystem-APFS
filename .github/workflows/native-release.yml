# SPDX-License-Identifier: GPL-3.0-or-later
# APFS hosted V2 supports read-only namespace and file extent mapping. Do not publish a BOOT-compatible
# release until the same native engine passes Common V2 namespace reads,
# production BOOT validation and disposable OVMF kernel/initramfs tests.
name: Qualify APFS hosted V2 package without kernel fallback
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install verified independent APFS image tools
        run: bash tests/apfsprogs-fixture-tools.sh
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev
      - name: Build and qualify portable DEB and source-first native RUN
        run: |
          set -euo pipefail
          python3 -m py_compile standalone/build.py standalone/release.py
          python3 standalone/release.py release
          bootstrap="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          test -s "$bootstrap"
          test "$(wc -c < "$bootstrap")" -lt 8192
          if grep -aF '__IFS_SOURCE_PAYLOAD_BELOW__' "$bootstrap"; then exit 1; fi
          grep -F "$GITHUB_SHA" "$bootstrap"
          python3 standalone/check-package.py dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.ko' | wc -l)" = 0
          extract="$RUNNER_TEMP/portable"
          mkdir -p "$extract"
          dpkg-deb -x dist/*.deb "$extract"
          test "$(find "$extract" -type f | wc -l)" = 2
          test -s "$extract/System/Filesystems/APFS.so"
          bash tests/check_v2_exports.sh "$extract/System/Filesystems/APFS.so"
          test "$(find "$extract" -name '*.ko' | wc -l)" = 0
      - name: Native RUN contains only APFS.so and its PDF
        run: |
          set -euo pipefail
          run_file="$(find dist -maxdepth 1 -name '*.run' -print -quit)"
          bash "$run_file" --profile aggressive --build-only --output "$RUNNER_TEMP/native"
          deb_file="$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb_file"
          python3 standalone/check-package.py "$deb_file" --profile aggressive
          mkdir -p "$RUNNER_TEMP/native-root"
          dpkg-deb -x "$deb_file" "$RUNNER_TEMP/native-root"
          test "$(find "$RUNNER_TEMP/native-root" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/native-root/System/Filesystems/APFS.so"
          test "$(find "$RUNNER_TEMP/native-root" -name '*.ko' | wc -l)" = 0
      - name: Probe independently formatted containers using both installed packages and their embedded ELFs
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/apfs-container"
          git clone -q https://github.com/Infiltrator-Projects/Libraries "$work"
          git -C "$work" checkout -q d23a52693fd3212368d327e1c1302e07ae9510ec
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -I"$work/include" tests/test_container_media.c -ldl -o "$RUNNER_TEMP/apfs-probe"
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -I"$work/include" tests/test_format.c -ldl -o "$RUNNER_TEMP/apfs-format"
          for profile in portable native-root; do
            sh tests/format_media.sh "$RUNNER_TEMP/apfs-format" "$RUNNER_TEMP/$profile/System/Filesystems/APFS.so" "$(command -v apfsck)"
            bash tests/container-media.sh "$RUNNER_TEMP/apfs-probe" "$RUNNER_TEMP/$profile/System/Filesystems/APFS.so"
          done
      - name: Verify exact embedded APFS V2 firmware ELF from each packaged installer
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/apfs-firmware-verify"
          cmake -S . -B "$check" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$check" --target apfs-firmware-v2-namespace-test apfs-firmware --parallel 2
          for root in portable native-root; do
            carrier="$RUNNER_TEMP/$root/System/Filesystems/APFS.so"
            payload="$RUNNER_TEMP/$root-firmware.so"
            objcopy --dump-section ".infiltrator_boot=$payload" "$carrier"
            cmp -- "$payload" "$check/firmware/APFS.so"
            "$check/apfs-firmware-v2-namespace-test" "$payload"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: APFS-hosted-v2-qualification-only-not-a-BOOT-release
          path: dist/*
          if-no-files-found: error
  publish:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: APFS-hosted-v2-qualification-only-not-a-BOOT-release
          path: dist
      - name: Publish immutable qualified hosted V2 packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.ko' | wc -l)" -eq 0
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Existing immutable release $tag preserved"
            exit 0
          fi
          gh release create "$tag" dist/*.deb dist/*.run --target "$GITHUB_SHA" \
            --title "APFS hosted Common V2 filesystem release $version" \
            --notes "APFS Common V2-only hosted filesystem module and manual. Qualifies source-owned read-only APFS namespace, native file extent mapping and verified container probes; old public V1 and kernel-module assets are excluded. This is NOT a fully qualified BOOT release."
