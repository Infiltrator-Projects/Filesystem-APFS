name: Build and verify APFS.so
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          test -f build/APFS.so
          nm -D build/APFS.so | grep -F infiltrator_filesystem_apfs_v1
      - uses: actions/upload-artifact@v4
        with:
          name: APFS-so
          path: build/APFS.so

      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          actual="$(cd "$stage" && find . -type f -printf '%P\\n' | LC_ALL=C sort)"
          expected="$(printf '%s\\n' 'System/Filesystems/APFS.so' 'System/Resources/Documentation/Filesystem-APFS/APFS.pdf' | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Incorrect installed payload:\\n%s\\n' "$actual"
            exit 1
          fi
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-APFS/APFS.pdf")" = '%PDF-'
