name: Build and verify APFS.so
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          test -f build/APFS.so
          nm -D --defined-only build/APFS.so | grep -F infiltrator_filesystem_api_v2
          nm -D --defined-only build/APFS.so | grep -F infiltrator_filesystem_apfs_v1
      - uses: actions/upload-artifact@v4
        with:
          name: APFS-so
          path: |
            build/APFS.so
            docs/APFS.pdf

      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -f "$stage/System/Filesystems/APFS.so"
          test -f "$stage/System/Resources/Documentation/Filesystem-APFS.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-APFS.pdf")" = '%PDF-'
